# Brain MRI Denoising - Training configuration
# Single source for reproducibility (paths, hyperparameters, seed)

seed: 42

data:
  root: ./data/brain_mri
  train_dir: ./data/Training
  test_dir: ./data/Testing
  image_ext: jpg
  val_ratio: 0.15
  test_ratio: 0.15
  # Resize all images to (H, W) so batches stack (dataset has variable sizes)
  size: [256, 256]

noise:
  type: gaussian  # gaussian | rician
  sigma: 0.1     # std for Gaussian; scale for Rician

model:
  architecture: unet
  in_channels: 1
  out_channels: 1
  base_channels: 32
  depth: 3       # encoder/decoder depth

training:
  batch_size: 8
  epochs: 3
  learning_rate: 0.001
  loss: l1       # l1 | l2
  early_stopping_patience: 10
  checkpoint_dir: ./checkpoints

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation_degrees: 15

output:
  predictions_dir: ./predictions
  figures_dir: ./figures
