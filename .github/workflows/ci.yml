name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        run: ruff check src scripts --ignore E501

      - name: Unit tests
        run: PYTHONPATH=. pytest tests/ -v

  smoke-inference:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create minimal checkpoint (smoke)
        run: |
          python -c "
          import torch
          from pathlib import Path
          Path('checkpoints').mkdir(exist_ok=True)
          from src.models.unet import UNet
          m = UNet(1, 1, 32, 3)
          torch.save({'model_state_dict': m.state_dict(), 'config': {'model': {'in_channels': 1, 'out_channels': 1, 'base_channels': 32, 'depth': 3}}}, 'checkpoints/smoke.pt')
          "

      - name: Smoke test inference (shape and value range)
        run: |
          python -c "
          import torch
          import numpy as np
          from PIL import Image
          from pathlib import Path
          Path('smoke_in').mkdir(exist_ok=True)
          Path('smoke_out').mkdir(exist_ok=True)
          img = (np.random.rand(64, 64) * 255).astype(np.uint8)
          Image.fromarray(img).save('smoke_in/sample.png')
          from src.inference.predict import load_model, run_inference
          model = load_model('checkpoints/smoke.pt')
          out_paths = run_inference(model, ['smoke_in/sample.png'], 'smoke_out')
          assert len(out_paths) == 1
          out = np.array(Image.open(out_paths[0]))
          assert out.shape == (64, 64)
          assert out.min() >= 0 and out.max() <= 255
          print('Smoke test passed: output shape and value range OK')
          "

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: brain-mri-denoise:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
